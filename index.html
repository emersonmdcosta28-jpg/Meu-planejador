<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meu Planejador</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4fa;color:#20263b;font:15px system-ui,sans-serif;padding-bottom:100px}header{background:linear-gradient(135deg,#25204e,#5145cd);color:white;padding:26px 22px;border-radius:0 0 25px 25px}header h1{font-size:25px;margin:12px 0 6px}header small{color:#ddd9ff}main{max-width:760px;margin:auto;padding:18px}h2{font-size:19px}p{line-height:1.5}.card{background:white;border:1px solid #e5e8f0;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 15px #20263b0a}.card h2{margin-top:0}.hero{background:linear-gradient(135deg,#29245c,#5145cd);color:white}.hero small{color:#dedaff}.big{font-size:36px;font-weight:750}small{color:#626d83}button,a.btn{display:block;width:100%;padding:13px;margin-top:12px;border:0;border-radius:11px;background:#5145cd;color:white;font:600 14px system-ui;text-align:center;text-decoration:none;cursor:pointer}a.btn,.back{background:#eeecff;color:#5145cd}progress{width:100%;height:9px;accent-color:#5145cd;margin:12px 0}label{display:flex;gap:10px;align-items:flex-start;line-height:1.5}input[type=checkbox]{width:21px;height:21px;flex-shrink:0;accent-color:#16834b}input[type=number]{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:9px}.task{padding:14px;background:#f7f8fc;border-radius:12px;margin:12px 0}.task:has(input:checked){background:#e8f7ee}.done{border-left:4px solid #16834b}.subject{display:flex;align-items:center;gap:12px}.emoji{font-size:24px;background:#eeecff;padding:10px;border-radius:12px}.subject strong{flex:1}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;border-top:1px solid #e5e8f0;padding:8px 4px;z-index:10}nav button{max-width:180px;flex:1;background:white;color:#626d83;margin:0;padding:8px 2px;font-size:11px}nav button.active{color:#5145cd;background:#eeecff}nav span{display:block;font-size:22px}.date{text-transform:capitalize;color:#626d83}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics div{background:#eeecff;padding:12px;border-radius:12px}.metrics strong{display:block;font-size:25px;color:#5145cd}

.subject-choice,.topic-choice{display:flex;align-items:center;gap:12px;text-align:left;background:white;color:#20263b;border:1px solid #e5e8f0;padding:14px;border-radius:16px;box-shadow:0 3px 12px #20263b08}.subject-choice .details,.topic-choice .details{flex:1;min-width:0}.details small{display:block;margin-top:5px}.details progress{display:block;margin:8px 0 0;height:6px}.chevron{color:#5145cd;font-size:22px}.topic-choice .number{color:#5145cd;font-weight:700;min-width:25px}.topic-choice.current{border-color:#5145cd}.topic-choice.done{border-left:4px solid #16834b}.back{width:auto}.hero button{background:white;color:#5145cd}.task small{display:block;margin-bottom:8px}button:disabled{opacity:.55;cursor:default}header{padding:22px}header h1{margin:6px 0}nav{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:5px;border-top:1px solid #ffffff44;padding-top:12px}.stats span{font-size:12px}.stats b{display:block;font-size:24px}.filters{display:flex;gap:6px}.filters button{background:white;color:#5145cd;padding:10px 4px;margin:0}.filters .selected{background:#5145cd;color:white}.review{background:#fff5e5;border-color:#ecd6ad;color:#80510c}.review button{background:#925b13}.green,.done .number{color:#16834b}.done progress{accent-color:#16834b}select{width:100%;padding:12px;border:1px solid #ccd0db;border-radius:9px;background:white;font:inherit}h3{font-size:15px;margin-top:24px}.hero progress{accent-color:#b8a8ff}.topic-choice strong{font-size:13px;white-space:nowrap}.daily-label{color:#5145cd;font-weight:700}.daily h2{margin:8px 0}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:12px 0}.week div{text-align:center;border-radius:9px;background:#f1f4fa;padding:7px 1px;font-size:11px}.week span{display:block;margin-top:5px;font-size:14px}.week .today{background:#5145cd;color:white}.week .met{background:#e4f5eb;color:#16834b}</style></head><body><header><small>PREPARAÇÃO PARA CONCURSOS</small><h1>Meu Planejador</h1>Prefeitura de Imperatriz – MA</header><nav><button onclick="home()"><span>⌂</span>Estudar</button><button onclick="simulation()"><span>✓</span>Simulados</button><button onclick="progressPage()"><span>▥</span>Progresso</button></nav><main id="app"></main><script>

const subjects=[{"name": "Língua Portuguesa", "icon": "📘", "topics": ["Compreensão e interpretação de textos", "Tipologias e gêneros textuais", "Coesão e coerência", "Variação linguística", "Figuras de linguagem", "Classes de palavras", "Sintaxe do período simples", "Sintaxe do período composto", "Concordância nominal", "Concordância verbal", "Regência nominal", "Regência verbal", "Denotação e conotação", "Homonímia, paronímia e ambiguidade", "Pontuação e sentido do texto", "Ortografia"]}, {"name": "Matemática", "icon": "📐", "topics": ["Sistema de numeração decimal", "Números inteiros: operações e propriedades", "Múltiplos e divisores", "MDC e MMC", "Números racionais: operações e problemas", "Razões e proporções", "Divisão proporcional", "Regra de três simples", "Regra de três composta", "Porcentagem", "Juros simples", "Sistemas de medidas decimais e não decimais", "Números reais", "Expressões e operações algébricas", "Fatoração e frações algébricas", "Equações e inequações do primeiro grau", "Equações e inequações do segundo grau", "Sistemas de equações do primeiro e segundo graus", "Funções: domínio, imagem, gráficos e raízes", "Funções: crescimento, composição e inversão", "Função do primeiro grau", "Função do segundo grau", "Função exponencial", "Função logarítmica", "Princípio fundamental da contagem", "Arranjos simples e com repetição", "Combinações simples e com repetição", "Permutações simples e com repetição", "Probabilidade: conceito e cálculo", "Adição e multiplicação de probabilidades", "Dependência de eventos", "Progressão aritmética", "Progressão geométrica", "Sistemas lineares: resolução e discussão", "Geometria plana: conceitos primitivos e ângulos", "Triângulos e quadriláteros", "Polígonos e circunferência", "Teorema de Tales", "Semelhança de triângulos", "Relações métricas no triângulo retângulo", "Razões trigonométricas", "Áreas de figuras planas", "Geometria espacial: superfícies e volumes", "Estatística: médias, frequências e gráficos"]}, {"name": "Raciocínio Lógico", "icon": "🧠", "topics": ["Estruturas lógicas", "Proposições e conectivos", "Tabelas-verdade", "Negação e equivalência lógica", "Lógica de argumentação", "Diagramas lógicos", "Situações-problema"]}, {"name": "Noções de Informática", "icon": "💻", "topics": ["Computadores: conceitos, utilização e tipos", "Hardware, periféricos e conexões", "Redes cabeadas e wireless", "Dispositivos móveis", "Organização de dados e informações", "Processamento e armazenamento de dados", "Banco de dados e representação numérica", "Windows", "Linux", "Gerenciamento e ferramentas de sistema", "Software e aplicativos", "Linguagens de programação", "Microsoft Office", "LibreOffice", "Sistemas de informação e ERP", "Sistemas gráficos e mapas", "Realidade virtual e aumentada", "Redes de computadores", "Internet: serviços e protocolos", "Navegadores e mecanismos de busca", "Acesso e compartilhamento de recursos", "Intranet e extranet", "Comunicação e redes sociais", "Computação em nuvem", "Virtualização", "Backup", "Segurança da informação", "Malwares e prevenção", "Invasões e outras ameaças"]}, {"name": "História e Geografia de Imperatriz", "icon": "📍", "topics": ["História, origem e fundação", "Desenvolvimento histórico do município", "Geografia, localização e território", "Dados oficiais do IBGE", "Informações históricas e geográficas oficiais", "Símbolos municipais: Lei 346/1985", "Lei Municipal 1389/2010", "Feriados municipais: Lei 370/85-GAB", "Limites geográficos e área urbana: Lei 923/200 (referência a conferir)", "Lei Municipal 1346/2010", "Lei Municipal 1738/2018"]}];
let data;try{data=JSON.parse(localStorage.getItem("meuPlanejador")||"{}")}catch(e){data={}};if(!data||typeof data!=="object")data={};for(const k of ["done","tasks","previous","tests","reviews"])if(!data[k]||typeof data[k]!=="object"||Array.isArray(data[k]))data[k]={};
const app=document.getElementById("app"),key=(s,t)=>s+"-"+t,save=()=>{try{localStorage.setItem("meuPlanejador",JSON.stringify(data))}catch(e){alert("Não foi possível salvar neste navegador. Verifique o armazenamento.")}},search=q=>"https://www.google.com/search?q="+encodeURIComponent(q),youtube=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q),link=(u,t)=>`<a class="btn" target="_blank" rel="noopener" href="${u}">${t} ↗</a>`;
const total=subjects.reduce((a,s)=>a+s.topics.length,0),count=()=>Object.keys(data.done).length,bar=(n,m)=>`<progress value="${n}" max="${m}"></progress>`,next=s=>subjects[s].topics.findIndex((x,t)=>!data.done[key(s,t)]);
function active(i){document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));window.scrollTo(0,0)}
function cards(){return subjects.map((s,i)=>{const n=s.topics.filter((x,t)=>data.done[key(i,t)]).length;return `<button class="subject-choice" onclick="openSubject(${i})"><span class="emoji">${s.icon}</span><span class="details"><strong>${s.name}</strong>${(!recommendation().complete&&recommendation().s===i)?'<small class="daily-label">RECOMENDADO HOJE</small>':''}<small>${n} de ${s.topics.length} conteúdos</small>${bar(n,s.topics.length)}</span><span class="chevron">›</span></button>`}).join('')}
function hero(){return `<div class="card hero"><small>PROGRESSO GERAL</small><div class="big">${Math.round(count()/total*100)}%</div>${bar(count(),total)}<small>${count()} de ${total} conteúdos concluídos</small></div>`}
function cycle(d=new Date()){const day=(d.getDay()+6)%7;const monday=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()-day);return ((Math.floor((monday-Date.UTC(2026,10,23))/604800000)%2)+2)%2}
function dailyPlan(d=new Date()){return (cycle(d)===0?[0,1,3,0,2,4,-1]:[1,0,3,1,2,4,-1]).map(s=>s<0?[]:[s])}
function studiedOn(s,d){return subjects[s].topics.some((_,t)=>{const v=data.done[key(s,t)];return v&&new Date(v).toDateString()===d.toDateString()})}
function recommendation(d=new Date()){const day=(d.getDay()+6)%7;if(day===6)return {day,s:-1,t:-1,complete:false};const planned=dailyPlan(d)[day][0];if(studiedOn(planned,d))return {day,s:-1,t:-1,complete:true};const s=next(planned)>=0?planned:[0,1,3,2,4].find(i=>next(i)>=0);return {day,s:s??-1,t:s===undefined?-1:next(s),complete:s===undefined||studiedOn(s,d)}}
function dailyCard(d=new Date()){const r=recommendation(d),plan=dailyPlan(d),names=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];const monday=new Date(d);monday.setDate(d.getDate()-r.day);const tomorrow=new Date(d);tomorrow.setDate(d.getDate()+1);const nr=recommendation(tomorrow);const upcoming=nr.day===6?'Domingo de descanso':nr.s<0?'Conteúdos concluídos':subjects[nr.s].icon+' '+subjects[nr.s].name;let body;if(r.day===6)body=`<h2>☕ Domingo de descanso</h2><p>Aproveite seu descanso. Amanhã começa uma nova semana.</p><small>Próxima sessão: ${upcoming}</small>`;else if(r.complete)body=`<h2>✓ Meta de hoje cumprida</h2><p>Você pode descansar ou continuar estudando outra matéria.</p><small>Amanhã: ${upcoming}</small>`;else body=`<h2>${subjects[r.s].icon} ${subjects[r.s].name}</h2><p><b>${r.t+1}. ${subjects[r.s].topics[r.t]}</b></p><small>Próximo conteúdo · ${subjects[r.s].topics.some((_,i)=>data.done[key(r.s,i)])?'2h':'1h40'} sugeridas</small><button onclick="lesson(${r.s},${r.t})">${topicPct(r.s,r.t)?'Continuar':'Começar'} estudo de hoje →</button>`;const days=plan.map((ss,i)=>{const date=new Date(monday);date.setDate(monday.getDate()+i);return i<6&&date<=d&&ss.some(s=>studiedOn(s,date))});return `<div class="card daily"><small class="daily-label">RECOMENDAÇÃO DE HOJE</small><p class="date">${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · Semana ${cycle(d)+1}</p>${body}<h3>Minha semana · ${days.filter(Boolean).length}/6 dias</h3><div class="week">${plan.map((ss,i)=>`<div class="${i===r.day?'today':''} ${days[i]?'met':''}"><b>${names[i]}</b><span>${days[i]?'✓':i===6?'☕':subjects[ss[0]].icon}</span></div>`).join('')}</div><button class="back" onclick="routinePage()">Ver planejamento semanal</button>${r.day===5?'<button class="back" onclick="simulation()">Simulado semanal (opcional)</button>':''}</div>`}
function routinePage(offset=0){active(0);const d=new Date();d.setDate(d.getDate()+offset*7);const names=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];app.innerHTML=`<button class="back" onclick="home()">← Voltar</button><h2>Minha rotina de estudos</h2><div class="filters"><button class="${offset===0?'selected':''}" onclick="routinePage(0)">Esta semana</button><button class="${offset===1?'selected':''}" onclick="routinePage(1)">Próxima semana</button></div>`+dailyPlan(d).map((ss,i)=>`<div class="card subject"><span class="emoji">${i===6?'☕':subjects[ss[0]].icon}</span><div><small>${names[i]}</small><br><strong>${i===6?'Descanso':subjects[ss[0]].name}</strong>${i===5?'<p><small>Simulado semanal disponível</small></p>':''}</div></div>`).join('')}
function home(){active(0);app.innerHTML=hero()+dailyCard()+'<h2>Escolha uma disciplina</h2><small>Estude no seu ritmo. Continue de onde parou.</small>'+cards()}
function disciplines(){home()}
const pct=(n,m)=>m?Math.round(n/m*100):0;
function topicPct(s,t){const id=key(s,t);if(data.done[id])return 100;const keys=['video','pdf','questions','correct'];if(data.previous[id]!=null)keys.push('old');return pct(keys.filter(k=>data.tasks[id]?.[k]).length,keys.length)}
function blocks(s){const out=[];for(let i=0;i<subjects[s].topics.length;i+=4)out.push(subjects[s].topics.slice(i,i+4).map((_,j)=>i+j));return out}
function ready(s,b){return blocks(s)[b].every(t=>!!data.done[key(s,t)])}
function reviewDone(s,b){return !!data.reviews[key(s,b)]?.finished}
function openSubject(s,filter='all',keepScroll=false){if(!keepScroll)active(0);const sub=subjects[s],t=next(s),n=sub.topics.filter((x,i)=>data.done[key(s,i)]).length,bs=blocks(s),pending=bs.findIndex((_,b)=>ready(s,b)&&!reviewDone(s,b));app.innerHTML=`<button class="back" onclick="home()">← Todas as matérias</button><div class="card hero"><h2>${sub.icon} ${sub.name}</h2><small>Seu progresso na disciplina</small><div class="big">${pct(n,sub.topics.length)}%</div>${bar(n,sub.topics.length)}<div class="stats"><span><b>${sub.topics.length}</b>Conteúdos</span><span><b>${n}</b>Concluídos</span><span><b>${sub.topics.length-n}</b>Restantes</span></div></div>${pending<0?'':`<div class="card review"><strong>Revisão ${pending+1} disponível</strong><p>${bs[pending].length*5} questões dos conteúdos anteriores.</p><button onclick="reviewPage(${s},${pending})">Iniciar revisão</button></div>`}<div class="card"><small>${t<0?'TODOS OS CONTEÚDOS CONCLUÍDOS':'CONTINUE DE ONDE PAROU'}</small><h2 style="margin:12px 0">${t<0?'Parabéns!':(t+1)+'. '+sub.topics[t]}</h2>${t<0?'':`${bar(topicPct(s,t),100)}<small>${topicPct(s,t)}% das etapas</small><button onclick="lesson(${s},${t})">${topicPct(s,t)?'Continuar':'Começar'} estudo →</button>`}</div><h2>Conteúdo programático</h2><div class="filters">${[['all','Todos'],['done','Concluídos'],['pending','Pendentes']].map(([v,l])=>`<button class="${filter===v?'selected':''}" onclick="openSubject(${s},'${v}',true)">${l}</button>`).join('')}</div>`+bs.map((ts,b)=>{const visible=ts.filter(i=>filter==='all'||(filter==='done'?!!data.done[key(s,i)]:!data.done[key(s,i)]));const rd=reviewDone(s,b),r=ready(s,b);if(!visible.length&&filter!=='all'&&!(filter==='done'?rd:!rd&&r))return '';return `<h3>Bloco ${String(b+1).padStart(2,'0')} <small>· ${ts.length} conteúdos</small></h3>`+visible.map(i=>{const p=topicPct(s,i),d=!!data.done[key(s,i)];return `<button class="topic-choice ${d?'done':i===t?'current':''}" onclick="lesson(${s},${i})"><span class="number">${d?'✓':String(i+1).padStart(2,'0')}</span><span class="details">${sub.topics[i]}<small>${d?'Concluído':p===100?'Pronto para finalizar':p?'Em andamento':'Não iniciado'}</small>${bar(p,100)}</span><strong class="${d?'green':''}">${p}%</strong></button>`}).join('')+((filter==='all'||(filter==='done'?rd:!rd))?`<div class="card review ${rd?'done':''}"><strong>${rd?'✓ ':r?'↻ ':'🔒 '}Revisão ${String(b+1).padStart(2,'0')}</strong><p>${ts.length*5} questões · ${rd?'Concluída · '+pct(data.reviews[key(s,b)].scores.reduce((a,v)=>a+v,0),ts.length*5)+'% de acertos':r?'Disponível':'Após concluir este bloco'}</p><button ${r?'':'disabled'} onclick="reviewPage(${s},${b})">${rd?'Ver resultado':r?'Iniciar revisão':'Aguardando conteúdos'}</button></div>`:'')}).join('')}
function reviewPage(s,b){if(!ready(s,b))return;active(0);const ts=blocks(s)[b],id=key(s,b),r=data.reviews[id]||(data.reviews[id]={scores:ts.map(()=>null),finished:false});app.innerHTML=`<button class="back" onclick="openSubject(${s})">← Voltar à disciplina</button><div class="card hero"><small>${subjects[s].name}</small><h2>Revisão ${b+1}</h2>${ts.length} conteúdos · ${ts.length*5} questões</div>`+ts.map((t,i)=>`<div class="card"><strong>${subjects[s].topics[t]}</strong><p>Resolver 5 questões</p>${link(search(subjects[s].topics[t]+' questões comentadas concurso'),'Buscar questões')}<p>Quantidade de acertos (0 a 5)</p><select aria-label="Acertos do conteúdo ${t+1}" ${r.finished?'disabled':''} onchange="reviewScore(${s},${b},${i},this.value)"><option value="">Selecione</option>${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${r.scores[i]===v?'selected':''}>${v} de 5</option>`).join('')}</select></div>`).join('')+`<div class="card"><h2>Resultado da revisão</h2><div id="reviewResult"></div><button id="reviewFinish" onclick="finishReview(${s},${b})">${r.finished?'Voltar à disciplina':'Finalizar revisão'}</button></div>`;updateReview(s,b)}
function reviewScore(s,b,i,v){const r=data.reviews[key(s,b)];if(r.finished)return;const n=Number(v);r.scores[i]=v!==''&&Number.isInteger(n)&&n>=0&&n<=5?n:null;save();updateReview(s,b)}
function updateReview(s,b){const r=data.reviews[key(s,b)],n=r.scores.length*5,c=r.scores.reduce((a,v)=>a+(v??0),0),filled=r.scores.filter(v=>v!==null).length;document.getElementById('reviewResult').innerHTML=`<p>${filled} de ${r.scores.length} resultados registrados</p><div class="big">${c}/${n} · ${pct(c,n)}%</div>${bar(c,n)}<small>${r.finished?(pct(c,n)>=80?'Meta de 80% atingida.':'Reforce os erros antes de avançar.'):'Registre todos os resultados para finalizar.'}</small>`;document.getElementById('reviewFinish').disabled=!r.finished&&filled!==r.scores.length}
function finishReview(s,b){const r=data.reviews[key(s,b)];if(!r||!ready(s,b))return;if(r.finished){openSubject(s);return}if(r.scores.some(v=>!Number.isInteger(v)||v<0||v>5))return;r.finished=true;save();reviewPage(s,b)}
function lesson(s,t){active(0);const id=key(s,t),topic=subjects[s].topics[t];if(!(id in data.previous)){const prev=subjects[s].topics.map((x,i)=>i).filter(i=>i!==t&&data.done[key(s,i)]).sort((a,b)=>data.done[key(s,b)]-data.done[key(s,a)])[0];data.previous[id]=prev===undefined?null:prev;save()}const prev=data.previous[id],tasks=[];if(prev!==null){const old=subjects[s].topics[prev];tasks.push(['old','Resolver 10 questões: '+old,link(search(old+' questões concurso'),'Buscar questões anteriores')])}tasks.push(['video','Assistir à videoaula: '+topic,link(youtube(topic+' para concursos'),'Buscar videoaula no YouTube')],['pdf','Ler PDF sobre '+topic,link(search(topic+' apostila PDF concurso'),'Buscar PDF')],['questions','Resolver 10 questões: '+topic,link(search(topic+' questões comentadas concurso'),'Buscar questões')],['correct','Corrigir as questões e entender os erros',''
