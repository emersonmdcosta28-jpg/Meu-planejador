

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Planejador</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4fa;color:#20263b;font:15px system-ui,sans-serif;padding-bottom:100px}
header{background:linear-gradient(135deg,#25204e,#5145cd);color:white;padding:26px 22px;border-radius:0 0 25px 25px}
header h1{font-size:25px;margin:12px 0 6px}
header small{color:#ddd9ff}
main{max-width:760px;margin:auto;padding:18px}
h2{font-size:19px}
p{line-height:1.5}
.card{background:white;border:1px solid #e5e8f0;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 15px #20263b0a}
.card h2{margin-top:0}
.hero{background:linear-gradient(135deg,#29245c,#5145cd);color:white}
.hero small{color:#dedaff}
.big{font-size:36px;font-weight:750}
small{color:#626d83}
button,a.btn{display:block;width:100%;padding:13px;margin-top:12px;border:0;border-radius:11px;background:#5145cd;color:white;font:600 14px system-ui;text-align:center;text-decoration:none;cursor:pointer}
a.btn,.back{background:#eeecff;color:#5145cd}
progress{width:100%;height:9px;accent-color:#5145cd;margin:12px 0}
label{display:flex;gap:10px;align-items:flex-start;line-height:1.5}
input[type=checkbox]{width:21px;height:21px;flex-shrink:0;accent-color:#16834b}
input[type=number]{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:9px}
.task{padding:14px;background:#f7f8fc;border-radius:12px;margin:12px 0}
.task:has(input:checked){background:#e8f7ee}
.done{border-left:4px solid #16834b}
.subject{display:flex;align-items:center;gap:12px}
.emoji{font-size:24px;background:#eeecff;padding:10px;border-radius:12px}
.subject strong{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;border-top:1px solid #e5e8f0;padding:8px 4px;z-index:10}
nav button{max-width:180px;flex:1;background:white;color:#626d83;margin:0;padding:8px 2px;font-size:11px}
nav button.active{color:#5145cd;background:#eeecff}
nav span{display:block;font-size:22px}
.date{text-transform:capitalize;color:#626d83}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metrics div{background:#eeecff;padding:12px;border-radius:12px}
.metrics strong{display:block;font-size:25px;color:#5145cd}
</style>
</head>
<body>
<header>
<small>PREPARAÇÃO PARA CONCURSOS</small>
<h1>Meu Planejador</h1>
Prefeitura de Imperatriz – MA
</header>
<nav>
<button onclick="home()"><span>⌂</span>Início</button>
<button onclick="disciplines()"><span>▤</span>Disciplinas</button>
<button onclick="simulation()"><span>✓</span>Simulados</button>
<button onclick="progressPage()"><span>▥</span>Progresso</button>
</nav>
<main id="app"></main>
<script>
const subjects=[
{name:"Língua Portuguesa",icon:"📘",topics:[
"Compreensão e interpretação de textos",
"Tipologias e gêneros textuais",
"Coesão e coerência",
"Variação linguística",
"Figuras de linguagem",
"Classes de palavras",
"Sintaxe do período simples",
"Sintaxe do período composto",
"Concordância nominal",
"Concordância verbal",
"Regência nominal",
"Regência verbal",
"Denotação e conotação",
"Homonímia, paronímia e ambiguidade",
"Pontuação e sentido do texto",
"Ortografia"
]},
{name:"Matemática",icon:"📐",topics:[
"Sistema de numeração decimal",
"Números inteiros: operações e propriedades",
"Múltiplos e divisores",
"MDC e MMC",
"Números racionais: operações e problemas",
"Razões e proporções",
"Divisão proporcional",
"Regra de três simples",
"Regra de três composta",
"Porcentagem",
"Juros simples",
"Sistemas de medidas decimais e não decimais",
"Números reais",
"Expressões e operações algébricas",
"Fatoração e frações algébricas",
"Equações e inequações do primeiro grau",
"Equações e inequações do segundo grau",
"Sistemas de equações do primeiro e segundo graus",
"Funções: domínio, imagem, gráficos e raízes",
"Funções: crescimento, composição e inversão",
"Função do primeiro grau",
"Função do segundo grau",
"Função exponencial",
"Função logarítmica",
"Princípio fundamental da contagem",
"Arranjos simples e com repetição",
"Combinações simples e com repetição",
"Permutações simples e com repetição",
"Probabilidade: conceito e cálculo",
"Adição e multiplicação de probabilidades",
"Dependência de eventos",
"Progressão aritmética",
"Progressão geométrica",
"Sistemas lineares: resolução e discussão",
"Geometria plana: conceitos primitivos e ângulos",
"Triângulos e quadriláteros",
"Polígonos e circunferência",
"Teorema de Tales",
"Semelhança de triângulos",
"Relações métricas no triângulo retângulo",
"Razões trigonométricas",
"Áreas de figuras planas",
"Geometria espacial: superfícies e volumes",
"Estatística: médias, frequências e gráficos"
]},
{name:"Raciocínio Lógico",icon:"🧠",topics:[
"Estruturas lógicas",
"Proposições e conectivos",
"Tabelas-verdade",
"Negação e equivalência lógica",
"Lógica de argumentação",
"Diagramas lógicos",
"Situações-problema"
]},
{name:"Noções de Informática",icon:"💻",topics:[
"Computadores: conceitos, utilização e tipos",
"Hardware, periféricos e conexões",
"Redes cabeadas e wireless",
"Dispositivos móveis",
"Organização de dados e informações",
"Processamento e armazenamento de dados",
"Banco de dados e representação numérica",
"Windows",
"Linux",
"Gerenciamento e ferramentas de sistema",
"Software e aplicativos",
"Linguagens de programação",
"Microsoft Office",
"LibreOffice",
"Sistemas de informação e ERP",
"Sistemas gráficos e mapas",
"Realidade virtual e aumentada",
"Redes de computadores",
"Internet: serviços e protocolos",
"Navegadores e mecanismos de busca",
"Acesso e compartilhamento de recursos",
"Intranet e extranet",
"Comunicação e redes sociais",
"Computação em nuvem",
"Virtualização",
"Backup",
"Segurança da informação",
"Malwares e prevenção",
"Invasões e outras ameaças"
]},
{name:"História e Geografia de Imperatriz",icon:"📍",topics:[
"História, origem e fundação",
"Desenvolvimento histórico do município",
"Geografia, localização e território",
"Dados oficiais do IBGE",
"Informações históricas e geográficas oficiais",
"Símbolos municipais: Lei 346/1985",
"Lei Municipal 1389/2010",
"Feriados municipais: Lei 370/85-GAB",
"Limites geográficos e área urbana: Lei 923/200 (referência a conferir)",
"Lei Municipal 1346/2010",
"Lei Municipal 1738/2018"
]}
];

let data=JSON.parse(localStorage.getItem("meuPlanejador")||"{}");
for(const k of ["done","tasks","previous","tests"])data[k]=data[k]||{};

const app=document.getElementById("app"),
key=(s,t)=>s+"-"+t,
save=()=>localStorage.setItem("meuPlanejador",JSON.stringify(data)),
search=q=>"https://www.google.com/search?q="+encodeURIComponent(q),
youtube=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q),
link=(u,t)=>`<a class="btn" target="_blank" rel="noopener" href="${u}">${t} ↗</a>`;

const total=subjects.reduce((a,s)=>a+s.topics.length,0),
count=()=>Object.keys(data.done).length,
bar=(n,m)=>`<progress value="${n}" max="${m}"></progress>`,
next=s=>subjects[s].topics.findIndex((x,t)=>!data.done[key(s,t)]);

function active(i){
document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));
window.scrollTo(0,0);
}

function cards(){
return subjects.map((s,i)=>{
let n=s.topics.filter((x,t)=>data.done[key(i,t)]).length;
return `<div class="card">
<div class="subject">
<span class="emoji">${s.icon}</span>
<strong>${s.name}</strong>
<b>${Math.round(n/s.topics.length*100)}%</b>
</div>
${bar(n,s.topics.length)}
<small>${n} de ${s.topics.length} conteúdos concluídos</small>
<button onclick="openSubject(${i})">Abrir disciplina →</button>
</div>`;
}).join('');
}

function hero(){
return `<div class="card hero">
<small>MEU PROGRESSO</small>
<div class="big">${Math.round(count()/total*100)}%</div>
${bar(count(),total)}
<small>${count()} de ${total} conteúdos concluídos</small>
</div>`;
}

function home(){
active(0);
const day=new Date().getDay(),
week=Math.floor((Date.now()-new Date(2026,10,23).getTime())/604800000),
rotation=[3,2,4],
s=({1:0,2:1,3:rotation[((week%3)+3)%3],4:0,5:1})[day];

app.innerHTML=`<p class="date">${new Date().toLocaleDateString('pt-BR',{dateStyle:'full'})}</p>
${hero()}
<h2>Estudo de hoje</h2>`;

if(day===0){
app.innerHTML+='<div class="card">Domingo: descanso.</div>';
}else if(day===6){
app.innerHTML+='<div class="card"><h2>Simulado semanal</h2><button onclick="simulation()">Realizar simulado</button></div>';
}else{
const t=next(s),
finished=subjects[s].topics.some((x,i)=>data.done[key(s,i)]&&new Date(data.done[key(s,i)]).toDateString()===new Date().toDateString());

app.innerHTML+=`<div class="card">
<small>${subjects[s].name} · 2 horas</small>
<h2>${finished?'Estudo de hoje concluído ✓':t<0?'Disciplina concluída':subjects[s].topics[t]}</h2>
${t>=0?`<button onclick="lesson(${s},${t})">${finished?'Adiantar próximo assunto':'Iniciar estudo'} →</button>`:''}
</div>`;
}
app.innerHTML+='<h2>Minhas disciplinas</h2>'+cards();
}

function disciplines(){
active(1);
app.innerHTML='<h2>Minhas disciplinas</h2>'+cards();
}

function openSubject(s){
active(1);
app.innerHTML=`<button class="back" onclick="disciplines()">← Disciplinas</button>
<h2>${subjects[s].name}</h2>`+
subjects[s].topics.map((t,i)=>`
<div class="card ${data.done[key(s,i)]?'done':''}">
<small>CONTEÚDO ${i+1}</small>
<p><strong>${t}</strong></p>
<small>${data.done[key(s,i)]?'✓ Concluído':'Pendente'}</small>
<button onclick="lesson(${s},${i})">${data.done[key(s,i)]?'Consultar':'Estudar'}</button>
</div>`).join('');
}

function lesson(s,t){
active(1);
const id=key(s,t),
topic=subjects[s].topics[t];

if(!(id in data.previous)){
const prev=subjects[s].topics.map((x,i)=>i)
.filter(i=>i!==t&&data.done[key(s,i)])
.sort((a,b)=>data.done[key(s,b)]-data.done[key(s,a)])[0];
data.previous[id]=prev===undefined?null:prev;
save();
}

const prev=data.previous[id],tasks=[];

if(prev!==null){
const old=subjects[s].topics[prev];
tasks.push(
['review','Revisar: '+old,''],
['old','Resolver 10 questões: '+old,link(search(old+' questões concurso'),'Buscar questões anteriores')]
);
}

tasks.push(
['video','Assistir à videoaula: '+topic,link(youtube(topic+' para concursos'),'Buscar videoaula no YouTube')],
['pdf','Ler PDF e resumo sobre '+topic,link(search(topic+' apostila PDF concurso'),'Buscar PDF')],
['questions','Resolver 10 questões: '+topic,link(search(topic+' questões comentadas concurso'),'Buscar questões')],
['correct','Corrigir as questões e entender os erros','']
);

data.tasks[id]=data.tasks[id]||{};

app.innerHTML=`
<button class="back" onclick="openSubject(${s})">← Voltar à disciplina</button>
<div class="card">
<small>${subjects[s].name} · 2 horas</small>
<h2>${topic}</h2>
<progress id="session" max="${tasks.length}" value="${tasks.filter(x=>data.tasks[id][x[0]]).length}"></progress>
<small id="sessionText"></small>
</div>
<h2>Minha sessão de estudo</h2>
<div class="card">
${prev===null?'<p>Primeiro assunto: sem revisão anterior.</p>':''}
${tasks.map((x,i)=>`
<div class="task">
<small>ETAPA ${i+1}</small>
<label>
<input type="checkbox" ${data.tasks[id][x[0]]?'checked':''} ${data.done[id]?'disabled':''} onchange="mark('${id}','${x[0]}',this.checked)">
<span>${x[1]}</span>
</label>
${x[2]}
</div>`).join('')}
<button onclick="finish(${s},${t},${prev!==null})">${data.done[id]?'✓ Finalizado':'Finalizar conteúdo'}</button>
</div>`;
updateSession();
}

function updateSession(){
const p=document.getElementById('session');
if(p){
p.value=app.querySelectorAll('input:checked').length;
document.getElementById('sessionText').textContent=p.value+' de '+p.max+' etapas concluídas';
}
}

function mark(id,k,v){
data.tasks[id][k]=v;
save();
updateSession();
}

function finish(s,t,review){
const id=key(s,t);
if(data.done[id])return;
const req=['video','pdf','questions','correct'];
if(review)req.push('review','old');
if(!req.every(k=>data.tasks[id][k])){
alert('Conclua todas as etapas primeiro.');
return;
}
data.done[id]=Date.now();
save();
openSubject(s);
}

function weekStart(){
const d=new Date();
d.setHours(0,0,0,0);
d.setDate(d.getDate()-((d.getDay()+6)%7));
return d;
}

function simulation(){
active(2);
const start=weekStart(),end=new Date(start);
end.setDate(end.getDate()+7);
const w=start.toISOString(),items=[];

subjects.forEach((s,i)=>s.topics.forEach((t,j)=>{
const d=data.done[key(i,j)];
if(d>=start.getTime()&&d<end.getTime())items.push({subject:s.name,topic:t});
}));

const n=items.length*5;

app.innerHTML=`
<h2>Simulado semanal</h2>
<div class="card hero">
<div class="big">${n}</div>
Questões para resolver · 5 por assunto
</div>
<div class="card">
${items.map(x=>`
<div class="task">
<small>${x.subject}</small>
<p>${x.topic} — 5 questões</p>
${link(search(x.topic+' questões concurso'),'Buscar questões')}
</div>`).join('')}
${data.tests[w]?`<p>✓ Simulado concluído: ${data.tests[w].correct}/${data.tests[w].total} acertos.</p>`:n?`
<p>Quantidade de acertos:</p>
<input id="score" type="number" min="0" max="${n}">
<button onclick="finishTest(${n})">Finalizar simulado</button>`:'<p>Nenhum assunto concluído nesta semana.</p>'}
</div>`;
}

function finishTest(n){
const raw=document.getElementById('score').value,c=Number(raw);
if(raw===''||!Number.isInteger(c)||c<0||c>n){
alert('Informe uma quantidade válida.');
return;
}
data.tests[weekStart().toISOString()]={correct:c,total:n};
save();
simulation();
}

function progressPage(){
active(3);
app.innerHTML='<h2>Meu progresso</h2>'+hero()+`
<div class="card metrics">
<div><strong>${count()}</strong>Concluídos</div>
<div><strong>${total-count()}</strong>Pendentes</div>
<div><strong>${new Set(Object.values(data.done).map(x=>new Date(x).toDateString())).size}</strong>Dias de estudo</div>
<div><strong>${Object.keys(data.tests).length}</strong>Simulados</div>
</div>`+cards();
}

home();
</script>
</body>
</html>
